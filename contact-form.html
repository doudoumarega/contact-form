<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us | Acme Support</title>
  </head>
  <body>
    <header>			
		<p>Acme Support</p>
		<nav>
			<a href="Home.html" >Home</a>
			<a href="Help.html" >Help</a>
			<a href="Contact.html" >Contact</a>
		</nav>
    </header>
	
    <main>
		<h1>Contact us</h1>
		<p>Send us a message and we will get back to you</p>

		<form action="/send" method="post">
			<p>
				<label for="name">Full name</label>
				<input id="name" name="name" type="text" required minlength="3">
			</p>
			<p>
				<label for="email">Email address</label>
				<input id="email" name="email" type="email" required minlength="3">
			</p>
			
			<p>
				<label for="subject">Subject</label>
				<select id="subject" name="subject">
				  <option value="">Choose a topic</option>
				  <option value="plan">Plan pricing</option>
				  <option value="services">Our services</option>
				  <option value="other">Other topic</option>
				</select>
			</p>
			
			<p>
				<label for="message">Message</label>
				<textarea id="message" name="message" rows="4" cols="50" required minlength="10"></textarea>
			</p>
			
			<fieldset>
			  <legend>How did you hear about us ? </legend>
			  <p><label><input type="radio" name="referral" value="search"> Search</label></p>
			  <p><label><input type="radio" name="referral" value="friend"> Friend</label></p>
			  <p><label><input type="radio" name="referral" value="social_media"> Social Media</label></p>
			</fieldset>
			
			<p>
				<label>
					<input type="checkbox" name="newsletter" value="yes">
					Send me product updates
				</label>
			</p>
			<button type="submit">Send</button>
		</form>
		
    </main>
	
    <footer>
		<p>&copy; 2026 Acme Support</p>
    </footer>
  </body>
</html>
